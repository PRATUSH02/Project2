<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebe1 0%, #d4a5ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #quote-text {
            font-style: italic;
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        #quote-author {
            font-weight: bold;
            color: #777;
            text-align: right;
            margin-bottom: 25px;
        }
        button {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #5b4cc4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>💡 Wisdom of the Moment</h1>
        <p id="quote-text">"Click the button below to generate a completely random piece of motivation."</p>
        <p id="quote-author">- The Browser</p>
        <button onclick="generateQuote()">New Quote</button>
    </div>

    <script>
        const quotes = [
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "Make it simple, but significant.", author: "Don Draper" },
            { text: "Yesterday I was clever, so I wanted to change the world. Today I am wise, so I am changing myself.", author: "Rumi" },
            { text: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" },
            { text: "Code is like humor. When you have to explain it, it’s bad.", author: "Cory House" }
        ];

        function generateQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const randomQuote = quotes[randomIndex];
            
            document.getElementById('quote-text').innerText = `"${randomQuote.text}"`;
            document.getElementById('quote-author').innerText = `- ${randomQuote.author}`;
        }
    </script>

</body>
</html>
